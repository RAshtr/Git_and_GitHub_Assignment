<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
</head>
<body>
    <h2>User Submission Form</h2>

    {% if error %}
        <p style="color: #b30000; background: #ffe6e6; border: 1px solid #b30000; padding: 10px; width: 320px;">
            <strong>Error:</strong> {{ error }}
        </p>
    {% endif %}

    <form action="/submit" method="POST">
        <label>Name:</label><br>
        <input type="text" name="name" value="{{ name if name else '' }}"><br><br>

        <label>Email:</label><br>
        <input type="text" name="email" value="{{ email if email else '' }}"><br><br>

        <label>Message:</label><br>
        <textarea name="message">{{ message if message else '' }}</textarea><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
